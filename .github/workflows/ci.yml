name: ci

# Gate: every push and PR runs the full test suite. A merge that breaks a
# security invariant (advisory-cannot-move-scores, injection deflection,
# rate-limit / spend-cap behavior) fails CI and is blocked. Treat the test
# suite as executable security policy, not optional hygiene.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read          # least privilege: CI only needs to read the repo

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]   # test the versions you deploy on

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v4 as of 2026-07-13

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 as of 2026-07-13
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        working-directory: backend
        # No OPENAI_API_KEY in CI on purpose: tests exercise the deterministic
        # path + safe-degrade + injection deflection with zero network calls.
        run: python -m pytest -q

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v4 as of 2026-07-13
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 as of 2026-07-13
        with:
          python-version: "3.12"

      - name: Dependency vulnerability audit
        working-directory: backend
        # Fails the job if a known-vulnerable dependency is present
        # (supply-chain / OWASP A06:2021 Vulnerable and Outdated Components).
        run: |
          pip install pip-audit
          pip install -r requirements.txt
          pip-audit   # hard-fail: known-vulnerable dependency blocks the merge (OWASP A06:2021). Tree triaged clean 2026-07-11.
      - name: Secret scan (basic)
        # Cheap tripwire for a committed API key. Fails if a likely OpenAI key
        # pattern is found in tracked files.
        run: |
          if git grep -nE 'sk-[A-Za-z0-9]{20,}' -- . ; then
            echo "::error::Possible committed secret detected"; exit 1
          fi
          echo "No obvious secrets found."
